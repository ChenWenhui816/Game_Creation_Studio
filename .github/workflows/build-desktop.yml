name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean build/desktop.spec

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Personal_Game_Studio_UE -DestinationPath dist/Personal_Game_Studio_UE-${{ github.ref_name }}.zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal_Game_Studio_UE-${{ github.ref_name }}
          path: dist/Personal_Game_Studio_UE-${{ github.ref_name }}.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Personal_Game_Studio_UE-${{ github.ref_name }}.zip
