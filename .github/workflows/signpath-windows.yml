name: signpath-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  sign-windows:
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    runs-on: windows-latest
    env:
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        shell: pwsh
        run: |
          $line = Get-Content scripts/version.py | Select-String 'VERSION =' | Select-Object -First 1
          $version = $line.Line.Split('"')[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build unsigned desktop app
        run: python -m PyInstaller --noconfirm --clean build/desktop.spec

      - name: Upload unsigned exe for SignPath
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/Personal_Game_Studio_UE/Personal_Game_Studio_UE.exe
          if-no-files-found: error

      - name: Sign app exe
        id: sign-app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ env.VERSION }}

      - name: Replace app exe with signed copy
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-app -Recurse -Filter Personal_Game_Studio_UE.exe | Select-Object -First 1
          if (-not $signed) {
            $zip = Get-ChildItem signed-app -Recurse -Filter *.zip | Select-Object -First 1
            if ($zip) { Expand-Archive -Path $zip.FullName -DestinationPath signed-app-extracted -Force; $signed = Get-ChildItem signed-app-extracted -Recurse -Filter Personal_Game_Studio_UE.exe | Select-Object -First 1 }
          }
          if (-not $signed) { throw "SignPath 未返回签名后的 exe" }
          Copy-Item $signed.FullName dist/Personal_Game_Studio_UE/Personal_Game_Studio_UE.exe -Force
          $sig = Get-AuthenticodeSignature dist/Personal_Game_Studio_UE/Personal_Game_Studio_UE.exe
          if ($sig.Status -ne "Valid") { throw "签名 exe 校验失败：$($sig.Status)" }

      - name: Build installer with signed exe
        shell: pwsh
        run: ./build/build_installer.ps1

      - name: Upload unsigned setup for SignPath
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Personal_Game_Studio_UE-${{ env.VERSION }}-setup.exe
          if-no-files-found: error

      - name: Sign installer
        id: sign-setup
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-setup
          parameters: |
            version: ${{ env.VERSION }}

      - name: Replace setup with signed copy
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-setup -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (-not $signed) {
            $zip = Get-ChildItem signed-setup -Recurse -Filter *.zip | Select-Object -First 1
            if ($zip) { Expand-Archive -Path $zip.FullName -DestinationPath signed-setup-extracted -Force; $signed = Get-ChildItem signed-setup-extracted -Recurse -Filter "*setup.exe" | Select-Object -First 1 }
          }
          if (-not $signed) { throw "SignPath 未返回签名后的 setup" }
          Copy-Item $signed.FullName "dist/Personal_Game_Studio_UE-$env:VERSION-setup.exe" -Force
          $sig = Get-AuthenticodeSignature "dist/Personal_Game_Studio_UE-$env:VERSION-setup.exe"
          if ($sig.Status -ne "Valid") { throw "签名 setup 校验失败：$($sig.Status)" }

      - name: Package signed zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Personal_Game_Studio_UE -DestinationPath "dist/Personal_Game_Studio_UE-$env:VERSION.zip" -CompressionLevel Optimal -Force

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal_Game_Studio_UE-signed-${{ env.VERSION }}
          path: |
            dist/Personal_Game_Studio_UE-${{ env.VERSION }}.zip
            dist/Personal_Game_Studio_UE-${{ env.VERSION }}-setup.exe

      - name: Attach signed assets to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Personal_Game_Studio_UE-${{ env.VERSION }}.zip
            dist/Personal_Game_Studio_UE-${{ env.VERSION }}-setup.exe
